<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giggle-Guesser</title>
    <link rel="stylesheet" href="WebStyle.css">
</head>
<body>
    <a class="nav-link px-lg-3 py-3 py-lg-4" href="scratch.html"  style="font-size: large; text-align: right; margin-right: 50px;">Back to Scratch</a></p>
    <div class="container">
        <h1>Giggle-Guesser</h1>
        <div id="guessRows"></div>
        <p>Try to guess a 5 letter word that has something to do with comedy!</p>
        <p>Play as many times as you want!</p>
        <input type="text" id="guessInput" maxlength="5" placeholder="Enter your guess" />
        <button id="guessButton">Guess</button>
        <button id="restartButton" style="display:none;">Play Again</button>
        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
